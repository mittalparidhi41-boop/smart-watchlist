<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Log in — Smart Market Watchlist</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f6f7f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 32px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            width: 280px;
        }
        h1 { font-size: 18px; margin: 0 0 20px; }
        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }
        .error { color: #dc2626; font-size: 13px; margin-bottom: 10px; }
        .link { text-align: center; margin-top: 14px; font-size: 13px; }
        .link a { color: #4f46e5; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Log in</h1>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post">
            <input type="text" name="username" placeholder="Username" required autofocus>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>
        <p class="link">No account? <a href="/register">Register</a></p>
    </div>
</body>
</html>
